<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocabVenture - Welcome</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;500;600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../css/main.css">
    <link rel="stylesheet" href="../../css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="login-card" style="max-width: 500px;">
            <div class="text-center">
                <h1 class="title-font text-5xl font-extrabold mb-4" style="color: var(--orange-accent);">
                    VocabVenture
                </h1>
                <p class="text-lg text-gray-700 mb-8">
                    Welcome to <span class="title-font">VocabVenture</span> – a playful way to grow your words.
                </p>
                <button class="inline-block submit-btn title-font font-semibold" id="getStartedBtn">
                     Get Started
                </button>
            </div>
            <div class="mt-10 border-t pt-6">
                <p class="mt-6 text-gray-700 flex items-center justify-center gap-1">
                    Partnered with <span class="font-bold">FourLoop</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        // Function to handle navigation
        function goToLogin() {
            console.log('Get Started clicked');
            
            // Check if router exists (SPA mode)
            if (window.router && typeof window.router.navigate === 'function') {
                window.router.navigate('login');
            }
            // Check if navigateTo exists
            else if (window.navigateTo && typeof window.navigateTo === 'function') {
                window.navigateTo('login');
            }
            // Fallback to direct navigation
            else {
                window.location.href = '../auth/login.html';
            }
        }
        
        // Attach event listener when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', function() {
                const btn = document.getElementById('getStartedBtn');
                if (btn) {
                    btn.addEventListener('click', goToLogin);
                }
            });
        } else {
            // DOM already loaded
            const btn = document.getElementById('getStartedBtn');
            if (btn) {
                btn.addEventListener('click', goToLogin);
            }
        }
    </script>
</body>
</html>
